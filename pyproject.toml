[project]
name = "scietex.qcm_service"
description = "Scietex microservice daemon for quartz crystal microbalance monitoring and control"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICEN[CS]E*"]
authors = [{ name = "Anton Bondarenko", email = "bond.anton@gmail.com" }]
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "scietex.service[valkey]~=6.2.0",
  "scietex.hal.qcm>=1.4.0,<2.0.0",
  "pymodbus~=3.15",
]
dynamic = ["version"]

[project.urls]
"Bug Tracker" = "https://github.com/bond-anton/scietex.qcm_service/issues"
"Homepage" = "https://github.com/bond-anton/scietex.qcm_service"

[project.scripts]
start-qcm-service = "scietex.qcm_service.run_worker:main"

[project.optional-dependencies]
dev = ["tox>=4.46.0"]
lint = ["ruff", "ty"]
test = ["pytest", "pytest-asyncio", "pytest-xdist"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.dynamic]
version = { attr = "scietex.qcm_service.version.__version__" }

[tool.setuptools.package-data]
"scietex.qcm_service" = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
